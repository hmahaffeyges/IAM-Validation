params:
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.044
      scale: 0.014
    proposal: 0.001
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  ns:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.9649
      scale: 0.004
    proposal: 0.002
    latex: n_\mathrm{s}
  cosmomc_theta:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.010411
      scale: 3.1e-06
    proposal: 2.0e-06
    latex: 100\theta_\mathrm{MC}
    renames: theta
  ombh2:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.02237
      scale: 0.00015
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omch2:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
  tau:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.0544
      scale: 0.007
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  H0:
    latex: H_0 \, [\mathrm{km/s/Mpc}]
  sigma8:
    latex: \sigma_8
  omegam:
    latex: \Omega_m
  s8omegamp5:
    derived: 'lambda sigma8, omegam: sigma8 * omegam**0.5'
    latex: \sigma_8 \Omega_m^{0.5}
  S8:
    derived: 'lambda sigma8, omegam: sigma8 * (omegam/0.3)**0.5'
    latex: S_8
sampler:
  mcmc:
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    max_tries: 10000
    burn_in: 0.3
    learn_proposal: true
output: iam_l2b_runA
packages_path: /home/hybridlevitation/IAM-Validation/packages
