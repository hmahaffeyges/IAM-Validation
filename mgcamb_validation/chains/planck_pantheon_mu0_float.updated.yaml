      min: 0.01
      max: 0.12
    ref:
      dist: norm
      loc: 0.0544
      scale: 0.0073
    proposal: 0.0073
  logA:
    prior:
      min: 2.6
      max: 3.5
    ref:
      dist: norm
      loc: 3.044
      scale: 0.014
    proposal: 0.014
    drop: true
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    derived: true
  ns:
    prior:
      min: 0.92
      max: 1.0
    ref:
      dist: norm
      loc: 0.9649
      scale: 0.0042
    proposal: 0.0042
