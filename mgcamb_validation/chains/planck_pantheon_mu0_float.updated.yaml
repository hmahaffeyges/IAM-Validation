    derived: true
  omegal:
    latex: \Omega_\Lambda
    derived: true
    renames:
    - omega_de
  s8omegamp5:
    derived: 'lambda sigma8, omch2, ombh2, H0: sigma8*(((omch2+ombh2)/(H0/100)**2)/0.3)**0.5'
  A_planck:
