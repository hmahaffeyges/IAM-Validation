      loc: 0.02242
      scale: 0.00014
    proposal: 0.00014
    renames:
    - omegabh2
  omch2:
    prior:
      min: 0.1
      max: 0.14
    ref:
      dist: norm
      loc: 0.11933
      scale: 0.00091
