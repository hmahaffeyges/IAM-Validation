# ==============================================================================
# Run G: IAM Fixed mu0 + Planck + BAO (distance only, no RSD)
# Tests whether IAM's perturbation modification affects BAO distance fits.
# At Level 1 (LCDM background), BAO distances should be identical to LCDM.
# This is a consistency check, not a discriminating test.
# ==============================================================================

theory:
  camb:
    path: null
    extra_args:
      MG_flag: 1
      pure_MG_flag: 2
      musigma_par: 1
      GRtrans: 0.001
      sigma0: 0.0
      lens_potential_accuracy: 1
      NonLinear: NonLinear_none
      lmax: 2500

likelihood:
  # Planck 2018
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_highl_plik.TTTEEE_lite:
  planck_2018_lensing.native:
  # BAO distance-only
  bao.sixdf_2011_bao:
  bao.sdss_dr7_mgs:
  bao.sdss_dr12_consensus_bao:

params:
  ombh2:
    prior: {min: 0.020, max: 0.025}
    ref: {dist: norm, loc: 0.02242, scale: 0.00014}
    proposal: 0.00014
  omch2:
    prior: {min: 0.10, max: 0.14}
    ref: {dist: norm, loc: 0.11933, scale: 0.00091}
    proposal: 0.00091
  H0:
    prior: {min: 60, max: 80}
    ref: {dist: norm, loc: 67.4, scale: 0.5}
    proposal: 0.5
  tau:
    prior: {min: 0.01, max: 0.12}
    ref: {dist: norm, loc: 0.0544, scale: 0.0073}
    proposal: 0.0073
  logA:
    prior: {min: 2.6, max: 3.5}
    ref: {dist: norm, loc: 3.044, scale: 0.014}
    proposal: 0.014
    drop: true
  As:
    value: "lambda logA: 1e-10*np.exp(logA)"
  ns:
    prior: {min: 0.92, max: 1.00}
    ref: {dist: norm, loc: 0.9649, scale: 0.0042}
    proposal: 0.0042
  mu0:
    value: -0.134950   # IAM prediction: derived, not fitted
  sigma8: {latex: \sigma_8}
  omegal: {latex: \Omega_\Lambda}
  s8omegamp5:
    derived: "lambda sigma8, omch2, ombh2, H0:
      sigma8*(((omch2+ombh2)/(H0/100)**2)/0.3)**0.5"

sampler:
  mcmc:
    burn_in: 300
    max_tries: 10000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.15

output: iam_planck_chains/planck_bao_iam_fixed
