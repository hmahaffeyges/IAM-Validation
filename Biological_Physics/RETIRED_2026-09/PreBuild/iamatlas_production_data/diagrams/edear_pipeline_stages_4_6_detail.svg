<rect class="card-pink" x="420" y="350" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-pink" x="520" y="375" text-anchor="middle">Colon / Rectal</text>

<rect class="card-pink" x="60" y="396" width="170" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-pink" x="145" y="421" text-anchor="middle">Gastric / Esophagus</text>
<rect class="card-pink" x="240" y="396" width="170" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-pink" x="325" y="421" text-anchor="middle">Glioma</text>
<rect class="card-pink" x="420" y="396" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-pink" x="520" y="421" text-anchor="middle">HCC Liver</text>

<rect class="card-pink" x="60" y="442" width="170" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-pink" x="145" y="467" text-anchor="middle">HEME Leukemia</text>
<rect class="card-pink" x="240" y="442" width="170" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-pink" x="325" y="467" text-anchor="middle">Lung</text>
<rect class="card-pink" x="420" y="442" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-pink" x="520" y="467" text-anchor="middle">Pancreatic</text>

<rect class="card-pink" x="60" y="488" width="170" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-pink" x="145" y="513" text-anchor="middle">Prostate</text>
<rect class="card-pink" x="240" y="488" width="170" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-pink" x="325" y="513" text-anchor="middle">Immune</text>
<rect class="card-amber" x="420" y="488" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-card-amber" x="520" y="513" text-anchor="middle">PSP — needs JSON</text>

<rect class="card-amber" x="60" y="534" width="170" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-card-amber" x="145" y="559" text-anchor="middle">Kidney — needs JSON</text>
<rect class="card-gray" x="240" y="534" width="380" height="40" rx="6" stroke-width="0.5"/>
<text class="ts ts-gray" x="430" y="559" text-anchor="middle">Schizophrenia — candidate, not yet built</text>

<line x1="340" y1="588" x2="340" y2="616" class="arr" marker-end="url(#arrow)"/>

<rect class="stage-teal" x="60" y="616" width="560" height="108" rx="8" stroke-width="0.5"/>
<text class="th th-teal" x="340" y="645" text-anchor="middle">Stage 5 — Diagnosis translation</text>
<text class="ts ts-teal" x="340" y="669" text-anchor="middle">Per matched card: tier, panel score, age and sex Z-score, CI</text>
<text class="ts ts-teal" x="340" y="689" text-anchor="middle">Concordance check (panel vs class A-score agreement)</text>
<text class="ts ts-teal" x="340" y="709" text-anchor="middle">Customer-relevant caveats only</text>
<line x1="340" y1="724" x2="340" y2="758" class="arr" marker-end="url(#arrow)"/>

<rect class="stage-coral" x="60" y="758" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th th-coral" x="340" y="787" text-anchor="middle">Stage 6 — Report generation</text>
<text class="ts ts-coral" x="340" y="811" text-anchor="middle">JSON, HTML, PDF outputs</text>
<text class="ts ts-coral" x="340" y="831" text-anchor="middle">Plain-language summary on top, technical detail beneath</text>
</svg>
