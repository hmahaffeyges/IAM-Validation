# ============================================================================
# IAM Level 2, Run C: LCDM Baseline
# ============================================================================
# IMPORTANT: Before running this, set iam_dual_sector = .false. in
# fortran/equations.f90 line 56 and rebuild:
#   cd fortran/Releaselib && rm -f *.o *.mod camblib.so && cd ../..
#   python setup.py make && pip install -e .
#
# OR: just use unmodified CAMB. Results should be identical to Level 1 Run C.
#
# Expected: sigma8 ~ 0.811, H0 ~ 67.2, chi2 ~ 983
# ============================================================================

sampler:
  mcmc:
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    max_tries: 10000
    burn_in: 0.3
    learn_proposal: true

output: chains/iam_level2_runC_lcdm

theory:
  camb:
    path: null
    extra_args:
      halofit_version: mead2020
      bbn_predictor: PArthENoPE_880.2_standard.dat
      lens_potential_accuracy: 1
      num_massive_neutrinos: 1
      nnu: 3.046
      theta_H0_range:
        - 20
        - 100

params:
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.044
      scale: 0.014
    proposal: 0.001
    latex: \log(10^{10} A_\mathrm{s})
    drop: true

  As:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_\mathrm{s}

  ns:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.9649
      scale: 0.004
    proposal: 0.002
    latex: n_\mathrm{s}

  cosmomc_theta:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0104110
      scale: 0.0000031
    proposal: 0.000002
    latex: 100\theta_\mathrm{MC}
    renames: theta

  ombh2:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.02237
      scale: 0.00015
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2

  omch2:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.1200
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2

  tau:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.0544
      scale: 0.007
    proposal: 0.003
    latex: \tau_\mathrm{reio}

  # Derived
  H0:
    latex: H_0 \, [\mathrm{km/s/Mpc}]
  sigma8:
    latex: \sigma_8
  omegam:
    latex: \Omega_m
  s8omegamp5:
    derived: "lambda sigma8, omegam: sigma8 * omegam**0.5"
    latex: \sigma_8 \Omega_m^{0.5}
  S8:
    derived: "lambda sigma8, omegam: sigma8 * (omegam/0.3)**0.5"
    latex: S_8

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_NPIPE_highl_CamSpec.TTTEEE: null
  planck_2018_lensing.CMBMarged: null
