name: gated-merge
# A commit pushed to a gate/* branch is rebased onto main, its generated documents rebuilt (CANON/build_all.py), the chain version registered
# when the commit message carries [register], and checked by CANON/checked_push.sh (every check; git push --dry-run). The main branch's
# ruleset lets only the owner push, so the exact files the gate checked are handed back (handback.json) and the session commits that same
# tree with the owner's token, refusing if its tree differs from the gated one.
# Added 2026-10-31: the session sandbox no longer allows a .git folder, so commits are made through GitHub's API onto a gate/* branch and
# this runner (which has git) does the gate and the push. The branch is deleted afterwards; the gate's output is kept as an artifact.
on:
  push:
    branches: ["gate/**"]
permissions:
  contents: write   # git push --dry-run must authenticate; main's ruleset still refuses any real push from this runner
concurrency: {group: gated-merge, cancel-in-progress: false}
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: dependencies (the chain's own requirements)
        run: pip install -q -r Biological_Physics/MethylPhys/chain/requirements.txt sympy beautifulsoup4 pillow pypdfium2
      - name: preflight (every package the chain needs is present)
        run: python3 Biological_Physics/MethylPhys/chain/preflight.py
      - name: rebase, build, register, gate (dry run), hand back
        env:
          BR: ${{ github.ref_name }}
        run: |
          set -o pipefail
          git config user.name "Heath W. Mahaffey"; git config user.email "hmahaffeyges@users.noreply.github.com"
          MSG="$(git log -1 --format=%B)"
          git fetch -q origin main
          git rebase -q origin/main > gate.log 2>&1 || { echo "GATED MERGE: REBASE CONFLICT" | tee -a gate.log; exit 1; }
          python3 CANON/build_all.py 2>&1 | tail -3 | tee -a gate.log
          if printf '%s' "$MSG" | grep -q '\[register\]'; then python3 CANON/chain_gate.py register 2>&1 | tail -1 | tee -a gate.log; fi
          git checkout -q -- CANON/canon_report.json 2>/dev/null || true
          git add -A; git checkout -q -- CANON/canon_report.json 2>/dev/null || true
          git diff --cached --quiet || git commit -q --amend --no-edit
          if bash CANON/checked_push.sh -q --dry-run origin HEAD:main >> gate.log 2>&1; then
            python3 - <<'EOF'
          import subprocess, json, base64
          g = lambda *a: subprocess.run(["git", *a], capture_output=True, text=True, check=True).stdout.strip()
          base = g("rev-parse", "origin/main"); out = dict(base=base, tree=g("rev-parse", "HEAD^{tree}"), files={}, modes={}, deleted=[])
          for l in g("diff", "--raw", "--no-renames", "--no-abbrev", base, "HEAD").splitlines():
              meta, p = l.split("\t", 1); f = meta.split(); st = f[4]
              if st == "D": out["deleted"].append(p)
              else: out["files"][p] = base64.b64encode(open(p, "rb").read()).decode(); out["modes"][p] = f[1]
          json.dump(out, open("handback.json", "w")); print("GATED MERGE: PASSED", out["tree"][:12], len(out["files"]), "files")
          EOF
            echo "GATED MERGE: PASSED" >> gate.log
          else echo "GATED MERGE: REFUSED" | tee -a gate.log; fi
          grep -v '^  ok' gate.log | tail -40
          grep -q "GATED MERGE: PASSED" gate.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: gate-log, path: "gate.log\nhandback.json", retention-days: 14, if-no-files-found: ignore}
