name: website

# Builds the web edition and the PDFs from docs/book/ and publishes them to GitHub Pages.
# Pushes to main that touch the book (or the site's own build files) build and deploy; pull requests build only and attach the
# site as an artifact for preview.
on:
  push:
    branches: [main]
    paths: ["docs/book/**", "website/**", "CANON/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["docs/book/**", "website/**", "CANON/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeXML, TeX Live and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends latexml texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils imagemagick epubcheck
      - name: Install tectonic (the engine the book is compiled with; builds the PDFs)
        run: |
          curl -fsSL -o /tmp/tectonic.tgz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz"
          sudo tar -xzf /tmp/tectonic.tgz -C /usr/local/bin tectonic
          tectonic --version
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ hashFiles('docs/book/preamble.tex', 'docs/book/main.tex') }}
          restore-keys: tectonic-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python packages
        run: pip install numpy scipy sympy beautifulsoup4 matplotlib pillow
      - name: Build site and PDFs
        run: bash website/build/build.sh
      - name: Check the PDFs and the EPUB are in the site
        run: |
          for f in pdf/IAMs_Law_and_Order.pdf pdf/part-1.pdf pdf/part-2.pdf pdf/part-3.pdf pdf/part-4.pdf pdf/part-5.pdf pdf/part-6.pdf \
                   pdf/part-7.pdf epub/IAMs_Law_and_Order.epub; do
            test -s "website/_site/$f" || { echo "::error::website/_site/$f is missing"; exit 1; }
          done
          ls -la website/_site/pdf website/_site/epub
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
