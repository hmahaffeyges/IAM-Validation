name: geo_pat
# 2026-10-28: published sequencing samples whose molecule files (.pat.gz, hg19) are on GEO, each read once by the one command through the
# committed pipeline's saved-molecules route (erase_gh.sh with PATFILE and FULL=1), its specimen given; one machine per sample.
on:
  workflow_dispatch:
    inputs:
      samples: {description: "CSV in this repository with columns gsm and cell (the specimen given to run_sample.py)", required: true}
      tag:     {description: "name for the results", required: true}
permissions: {contents: read, actions: read}
jobs:
  list:
    runs-on: ubuntu-latest
    outputs: {gsms: "${{ steps.l.outputs.gsms }}"}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "gsms=$(python3 -c "import csv,json; print(json.dumps([r['gsm'] for r in csv.DictReader(open('${{ inputs.samples }}'))]))")" >> $GITHUB_OUTPUT
  read:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy: {fail-fast: false, max-parallel: 20, matrix: {gsm: "${{ fromJSON(needs.list.outputs.gsms) }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Molecules from GEO; read once by the one command
        run: |
          pip install -q -r Biological_Physics/MethylPhys/chain/requirements.txt && python3 Biological_Physics/MethylPhys/chain/preflight.py || exit 1
          G=${{ matrix.gsm }}; U="https://ftp.ncbi.nlm.nih.gov/geo/samples/${G:0:7}nnn/$G/suppl/"
          F=$(curl -sfL --retry 5 "$U" | grep -o 'href="[^"]*\.pat\.gz"' | sed 's/href="//; s/"$//' | grep -v '\.hg38\.' | head -1)
          [ -n "$F" ] || { echo "no hg19 .pat.gz for $G on GEO"; exit 21; }
          curl -sfL --retry 5 -o $PWD/$G.pat.gz "$U$F"; ls -la $G.pat.gz
          export SPECIMEN="$(python3 -c "import csv,sys; print([r.get("specimen") or r["cell"] for r in csv.DictReader(open('${{ inputs.samples }}')) if r['gsm']==sys.argv[1]][0])" $G)"
          export THIN="$(python3 -c "import csv,sys; r=[r for r in csv.DictReader(open('${{ inputs.samples }}')) if r['gsm']==sys.argv[1]][0]; t=r.get('thin') or ''; print('' if t in ('', '1', '1.0') else t)" $G)"   # 2026-10-29: a thinning given in the sample list
          set +e; export INDEX_TAG=hg19-bwameth-index-v1 GITHUB_REPOSITORY=$GITHUB_REPOSITORY MP=$PWD/Biological_Physics/MethylPhys WORK=$HOME/ew OUT=$PWD/eout NW=4 FULL=1 PATFILE=$PWD/$G.pat.gz SAMPLES=${{ inputs.samples }}
          bash $MP/doors/data/DEV_ERASE_01/erase_gh.sh $G > run.log 2>&1; echo $? > rc.txt; tail -30 run.log; true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "${{ inputs.tag }}-${{ matrix.gsm }}", path: "eout/*.json\neout/*.log\nrun.log\nrc.txt", if-no-files-found: ignore}
