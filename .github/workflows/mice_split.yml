name: mice_split
# The mouse reproduction (reproduce/tests.json "mice") on GitHub's free machines, split (2026-10-21). One machine (16 GB) fits the mm10 index
# and the aligner with 1 thread (mice_test run 39695242010: peak 12.5 GB, index plus one read set 3 h 10 min; its SRR3111449 counts equal the
# committed 16-thread run's to the last digit). 19 jobs each build the index and align 2 of the 38 read sets (reproduce/mice_rrbs.sh,
# unchanged, RUNS and NW=1); a last job gathers the 38 .pat files and runs the committed test with its alignment step marked as done on those
# machines (reproduce.py, REPRO_DONE_ELSEWHERE=reads_to_pat): the committed scorer, then the comparison with the committed numbers. Manual only.
on: {workflow_dispatch: {}}
permissions: {contents: read, issues: write}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {shards: "${{ steps.p.outputs.shards }}"}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: Biological_Physics/MethylPhys/boxruns}
      - id: p
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import csv, json
          # 2026-10-22: two read sets per job, the largest paired with the smallest by bases (run 39714384304: three per job, 4 of 13 jobs
          # reached the 355-minute limit; the index takes about 2 h and each read set about 1.1 h on 1 thread)
          x = sorted(csv.DictReader(open("Biological_Physics/MethylPhys/boxruns/run6_sam/GSE77079_runs.csv")), key=lambda d: int(d["base_count"]))
          r = [d["run_accession"] for d in x]; n = len(r)
          print("shards=" + json.dumps([",".join([r[i], r[n - 1 - i]]) for i in range(n // 2)] + ([r[n // 2]] if n % 2 else [])))
          PY
  align:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: {runs: "${{ fromJSON(needs.plan.outputs.shards) }}"}
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true; df -h / | tail -1
      - uses: actions/checkout@v4
      - name: Index and align (1 thread)
        run: |
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile >/dev/null && sudo swapon /swapfile
          ( while true; do echo "MEM $(date -u +%H:%M:%S) used $(free -m | awk '/Mem:/{print $3}') MB"; sleep 300; done ) &
          set +e; export REPO=$PWD MP=$PWD/Biological_Physics/MethylPhys WORK=$HOME/mw PY=python3 NW=1 RUNS="${{ matrix.runs }}"
          bash $MP/reproduce/mice_rrbs.sh > run.log 2>&1; echo "rc $?"; tail -5 run.log
          mkdir -p pats && cp $WORK/seq/pat/*.pat.gz pats/; ls pats; echo "SHARD=$(echo '${{ matrix.runs }}' | cut -d, -f1)" >> $GITHUB_ENV
          test "$(ls pats | wc -l)" = "$(echo '${{ matrix.runs }}' | tr ',' '\n' | wc -l)"
      - uses: actions/upload-artifact@v4
        with: {name: "pats-${{ env.SHARD }}", path: pats/}
  compare:
    needs: align
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash Biological_Physics/MethylPhys/reproduce/setup.sh
      - uses: actions/download-artifact@v4
        with: {pattern: "pats-*", path: Biological_Physics/MethylPhys/reproduce/out/mice/seq/pat, merge-multiple: true}
      - name: Score and compare with the committed numbers
        run: |
          set +e; ls Biological_Physics/MethylPhys/reproduce/out/mice/seq/pat | wc -l
          REPRO_DONE_ELSEWHERE=reads_to_pat python3 Biological_Physics/MethylPhys/reproduce/reproduce.py mice > cmp.log 2>&1; echo $? > rc.txt; tail -30 cmp.log; true
      - name: Result to issue 32
        if: always()
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          b = "reproduce mice (split), run ${{ github.run_id }}, commit ${{ github.sha }}, exit " + open("rc.txt").read().strip() + "\n\n```\n" + open("cmp.log").read()[-6000:] + "\n```"
          rq = urllib.request.Request("https://api.github.com/repos/${{ github.repository }}/issues/32/comments", data=json.dumps({"body": b}).encode(), headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          print(urllib.request.urlopen(rq).status)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: compare, path: "cmp.log\nBiological_Physics/MethylPhys/reproduce/out/mice/verdict.json"}
      - run: test "$(cat rc.txt)" = 0
