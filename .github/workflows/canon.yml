name: canon-check
on:
  schedule:            # daily, so the live page and its checks cannot go stale between pushes (2026-10-13)
    - cron: "47 11 * * *"
  workflow_dispatch:
  push:
  pull_request:
jobs:
  canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Every LIVE file agrees with CANON/iam_canon.json
        run: python3 CANON/canon_check.py
